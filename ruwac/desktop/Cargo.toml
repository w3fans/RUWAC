[package]
license = "Apache-2.0"
name = "ruwac-desktop"
version = "0.4.37"
edition = "2024"
publish = false
authors = ["Denis Zvegelj"]
[workspace]

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_4"] }
pangocairo = "0.22"
serde_json = "=1.0.151"
ruwac-protocol = { path = "../crates/ruwac-protocol" }
ruwac-clipboard = { path = "../crates/ruwac-clipboard" }
libc = "=0.2.189"
sha2 = "=0.10.9"
ironrdp = { version = "=0.17.0", features = ["connector", "session", "graphics", "pdu", "cliprdr", "dvc", "displaycontrol", "svc"] }
ironrdp-tokio = { version = "=0.10.0", features = ["reqwest-native-tls"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
native-tls = "=0.2.18"
tokio-native-tls = "=0.3.1"
x509-cert = "=0.2.5"
ironrdp-cliprdr = "=0.7.0"
ironrdp-core = "=0.2.0"
ironrdp-egfx = "=0.3.0"
ironrdp-cliprdr-format = "=0.2.0"
png = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
futures-util = "=0.3.34"
ssh2 = "=0.9.6"
rusqlite = { version = "=0.39.0", default-features = false }
[dev-dependencies]
ironrdp-server = { version = "=0.13.0", default-features = false, features = ["helper"] }
async-trait = "0.1"
anyhow = "1"
bytes = "1"
[profile.dev]
debug = 0
[profile.release]
strip = true

[patch.crates-io]
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
ironrdp-session = { path = "vendor/ironrdp-session" }
