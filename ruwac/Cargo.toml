[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/alacritty_terminal"]

[workspace.package]
license = "Apache-2.0"
version = "0.4.38"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
uuid = { version = "=1.26.1", features = ["v4"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
portable-pty = "=0.9.0"
alacritty_terminal = "=0.26.0"
sha2 = "=0.10.9"
png = "=0.18.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[profile.dev]
debug = 0
[profile.release]
strip = true

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
