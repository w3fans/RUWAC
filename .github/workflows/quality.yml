name: Fedora source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Synthetic privacy regression tests
        run: python3 scripts/test-privacy-check.py
      - name: Public privacy rules and inventory
        run: python3 scripts/public-files.py --tracked
      - name: Scan outgoing commit metadata and snapshots
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/privacy-check.py --outgoing "$EVENT_BASE"
      - name: Install checksum-pinned secret scanner
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/privacy-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/privacy-tools" gitleaks
      - name: Standard scanner generated-example regressions
        env:
          RUWAC_GITLEAKS: ${{ runner.temp }}/privacy-tools/gitleaks
        run: python3 scripts/test-privacy-check.py
      - name: Standard secret scan of current public source
        run: |
          "$RUNNER_TEMP/privacy-tools/gitleaks" dir . --config scripts/gitleaks.toml --no-banner --redact --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/private-scan.json" > "$RUNNER_TEMP/private-scan.log" 2>&1 || { echo 'Secret scan failed; inspect source privately. Raw matches are not uploaded.'; exit 1; }
          "$RUNNER_TEMP/privacy-tools/gitleaks" git . --config scripts/gitleaks.toml --log-opts=--all --no-banner --redact > "$RUNNER_TEMP/private-history-scan.log" 2>&1 || { echo 'History secret scan failed; owner review required. Raw matches are not uploaded.'; exit 1; }

  quality:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize isolated build paths
        run: |
          printf 'CARGO_HOME=%s/cargo\nCARGO_TARGET_DIR=%s/target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Fedora test tools
        run: dnf install -y acl git cargo rust rustfmt clippy gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel webkitgtk6.0-devel openssl openssl-devel libssh2-devel sqlite-devel python3 python3-pyyaml python3-pillow tesseract tesseract-langpack-eng screen tmux fzf openssh-server openssh-clients shadow-utils rsync util-linux
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Trust only the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate GitHub workflow syntax and contexts
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/workflow-tools"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/workflow-tools" actionlint
          "$RUNNER_TEMP/workflow-tools/actionlint" -shellcheck= -pyflakes=
      - name: Public source inventory
        run: python3 scripts/public-files.py --tracked
      - name: Contribution label guards
        run: python3 .github/scripts/test-label-pr.py
      - name: GitHub updater and reversible installation guards
        run: python3 ruwac/tests/integration/test_updates.py
      - name: Publication readiness and incomplete-release refusal
        run: |
          python3 ruwac/tests/integration/test_release_readiness.py
          python3 ruwac/tests/integration/test_acceptance_gate.py
      - name: Fedora candidate bundle and installation integrity guards
        run: python3 ruwac/tests/integration/test_bundles.py
      - name: Validate workflow test command execution
        run: |
          python3 ruwac/tests/integration/test_workflow_commands.py
          python3 ruwac/tests/integration/test_desktop_mouse_stream.py
      - name: Testing artifact attestation subject regressions
        run: |
          python3 ruwac/tests/integration/test_testing_subjects.py
          python3 ruwac/tests/integration/test_verified_quality.py
      - name: Testing bundle updater integrity and archive faults
        run: |
          python3 ruwac/tests/integration/test_bundle_updates.py
          python3 ruwac/tests/integration/test_update_provenance.py
          python3 ruwac/tests/integration/test_rpm_updates.py
      - name: Opt-in agent installer contracts
        run: python3 ruwac/tests/integration/test_agent_bootstrap.py
      - name: Fail-closed local GDM recognition fixtures
        run: python3 ruwac/tests/integration/test_gdm_recognition.py
      - name: Rust formatting
        run: |
          cargo fmt --all --check --manifest-path ruwac/Cargo.toml
          cargo fmt --all --check --manifest-path ruwac/desktop/Cargo.toml
      - name: Rust lint
        run: |
          cargo clippy --locked --workspace --all-targets --manifest-path ruwac/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path ruwac/desktop/Cargo.toml
      - name: Prepare private runtime for desktop unit tests
        run: |
          python3 - <<'PY'
          import os, stat
          from pathlib import Path
          runtime = Path('/run/user') / str(os.getuid())
          runtime.mkdir(mode=0o700, parents=True, exist_ok=True)
          metadata = runtime.lstat()
          assert stat.S_ISDIR(metadata.st_mode)
          assert metadata.st_uid == os.getuid() and stat.S_IMODE(metadata.st_mode) == 0o700
          PY
      - name: Rust unit tests
        run: |
          cargo test --locked --workspace --manifest-path ruwac/Cargo.toml
          cargo test --locked --manifest-path ruwac/desktop/Cargo.toml
      - name: Real isolated SSH gateway and file transports
        run: |
          cargo build --locked --manifest-path ruwac/desktop/Cargo.toml --example files-fixture
          RUWAC_DISPOSABLE_SSH_USERS=1 python3 ruwac/tests/integration/ssh_access.py --driver "$CARGO_TARGET_DIR/debug/examples/files-fixture" --evidence "$RUNNER_TEMP/ssh-access-evidence" --disposable-users
          useradd -m -p '*' generated-ssh-test
          fixture_uid="$(id -u generated-ssh-test)"
          install -d -m 700 -o generated-ssh-test -g generated-ssh-test "/run/user/$fixture_uid" "$RUNNER_TEMP/ssh-jump-evidence"
          runuser -u generated-ssh-test -- python3 ruwac/tests/integration/ssh_jump.py --driver "$CARGO_TARGET_DIR/debug/examples/files-fixture" --evidence "$RUNNER_TEMP/ssh-jump-evidence"
          runuser -u generated-ssh-test -- python3 ruwac/tests/integration/ssh_recovery_identity.py --driver "$CARGO_TARGET_DIR/debug/examples/files-fixture" --evidence "$RUNNER_TEMP/ssh-jump-evidence"
          cargo build --locked --manifest-path ruwac/Cargo.toml
          runuser -u generated-ssh-test -- python3 ruwac/tests/integration/agent_session.py --binary "$CARGO_TARGET_DIR/debug/ruwac" --evidence "$RUNNER_TEMP/ssh-jump-evidence" --run-owned-fixture
      - name: Locked declarations and independent headless graph
        run: python3 scripts/dependency-check.py --output "$RUNNER_TEMP/dependencies.json"
      - name: Real headless protocol and persistence fixtures
        run: |
          cargo build --locked --manifest-path ruwac/Cargo.toml
          python3 ruwac/tests/integration/atomic_paste.py --binary "$CARGO_TARGET_DIR/debug/ruwac" --evidence "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ruwac-evidence"
          for test in spike desktop_state client_focus jobs jobs_capacity recovery screen_previous screen_copy history_snapshot primary_history checkpoint_validation terminal_styles_apps mixed_nesting terminal_usability cli_user_shell cli_shell_contract natural_grid status_bar split_dividers; do
            python3 "ruwac/tests/integration/$test.py" --binary "$CARGO_TARGET_DIR/debug/ruwac" --evidence "$RUNNER_TEMP/ruwac-evidence"
          done

  advisories:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Initialize isolated scanner paths
        run: |
          printf 'CARGO_HOME=%s/audit-cargo\nCARGO_TARGET_DIR=%s/audit-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install advisory scanner prerequisites
        run: dnf install -y git cargo rust gcc gcc-c++ cmake perl openssl-devel pkgconf-pkg-config
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Trust only the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tool"
      - name: Headless dependency advisories
        run: '"$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/Cargo.lock'
      - name: Desktop dependency advisories
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/desktop/Cargo.lock'
