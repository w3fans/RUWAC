name: Source release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      # Ordinary commits and pull-request merges on main are development
      # commits: publish nothing and end successfully. Quality and privacy run
      # in Fedora source checks. Only the controller-assigned tag at this exact
      # commit continues; a mismatched tag fails.
      - name: Classify push as versioned release or development commit
        id: mode
        run: python3 scripts/release-mode.py --ref "$GITHUB_REF" --env "$GITHUB_ENV" --output "$GITHUB_OUTPUT"
      - name: Verify public source and tag
        if: steps.mode.outputs.publish == 'true'
        run: |
          python3 scripts/public-files.py --tracked
          git log -1 --format=%B | python3 scripts/privacy-check.py --stdin
          python3 - <<'PYCODE'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('ruwac/Cargo.toml').read_text())['workspace']['package']['version']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.[0-9]\.([0-9]|[1-9][0-9])', tag)
          assert tag == 'v' + version, 'Tag and package version differ'
          PYCODE
      - name: Scan tag metadata and current source for secrets
        if: steps.mode.outputs.publish == 'true'
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" | python3 scripts/privacy-check.py --stdin
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/privacy-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/privacy-tools" gitleaks
          "$RUNNER_TEMP/privacy-tools/gitleaks" dir . --config scripts/gitleaks.toml --no-banner --redact > "$RUNNER_TEMP/private-scan.log" 2>&1 || { echo 'Secret scan failed; publication held. Raw matches are not uploaded.'; exit 1; }
      - name: Require exact-commit quality and privacy before source publication
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verified-quality.py
      - name: Publish source release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release-notes.py --tag "$RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG" --json url >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease="$RELEASE_PRERELEASE" \
              --title "RUWAC $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release view "$RELEASE_TAG" --json url,isPrerelease,tagName
      # Historical release repair is intentionally manual: replaying old notes can
      # republish material that has since been removed from the current tree.

  fedora-testing-bundle:
    if: github.repository == 'w3fans/RUWAC' && startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Initialize isolated paths and remap build paths
        run: |
          printf 'CARGO_HOME=%s/bundle-cargo\nCARGO_TARGET_DIR=%s/target\nCARGO_BUILD_JOBS=2\n' "$RUNNER_TEMP" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'RUSTFLAGS=--remap-path-prefix=%s=/usr/src/ruwac --remap-path-prefix=%s/bundle-cargo=/usr/src/cargo --remap-path-prefix=%s=/usr/src/build-home\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME" >> "$GITHUB_ENV"
          printf 'CFLAGS=-ffile-prefix-map=%s=/usr/src/ruwac -ffile-prefix-map=%s=/usr/src/build-home\n' "$GITHUB_WORKSPACE" "$HOME" >> "$GITHUB_ENV"
          printf 'CXXFLAGS=-ffile-prefix-map=%s=/usr/src/ruwac -ffile-prefix-map=%s=/usr/src/build-home\n' "$GITHUB_WORKSPACE" "$HOME" >> "$GITHUB_ENV"
      - name: Install Fedora build and scanner dependencies
        run: dnf install -y acl git cargo rust gcc gcc-c++ cmake perl openssl openssl-devel pkgconf-pkg-config gtk4-devel libadwaita-devel webkitgtk6.0-devel libssh2-devel sqlite-devel python3 curl tar gzip gh rpm-build desktop-file-utils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the existing controller tag and public source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/public-files.py --tracked
          python3 - <<'PYCODE'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('ruwac/Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert subprocess.check_output(['git','rev-parse',os.environ['GITHUB_REF_NAME']+'^{commit}'],text=True).strip() == os.environ['GITHUB_SHA']
          PYCODE
      - name: Prepare private runtime for desktop unit tests
        run: |
          python3 - <<'PY'
          import os, stat
          from pathlib import Path
          runtime = Path('/run/user') / str(os.getuid())
          runtime.mkdir(mode=0o700, parents=True, exist_ok=True)
          metadata = runtime.lstat()
          assert stat.S_ISDIR(metadata.st_mode)
          assert metadata.st_uid == os.getuid() and stat.S_IMODE(metadata.st_mode) == 0o700
          PY
      - name: Build and test the tagged compiled applications
        run: |
          command -v openssl
          cargo test --release --locked --workspace --manifest-path ruwac/Cargo.toml
          cargo test --release --locked --manifest-path ruwac/desktop/Cargo.toml
          cargo build --release --locked --manifest-path ruwac/Cargo.toml
          cargo build --release --locked --manifest-path ruwac/desktop/Cargo.toml
      - name: Install checksum-pinned artifact scanner and assemble testing bundle
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/privacy-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/privacy-tools" gitleaks
          RUWAC_GITLEAKS="$RUNNER_TEMP/privacy-tools/gitleaks" python3 scripts/bundle-user.py --build-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/bundles" > "$RUNNER_TEMP/bundle.json"
      - name: Assemble split Fedora testing RPMs and validate the desktop launcher
        run: |
          desktop-file-validate ruwac/packaging/ruwac.desktop
          RUWAC_GITLEAKS="$RUNNER_TEMP/privacy-tools/gitleaks" python3 scripts/rpm-user.py --build-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/rpms" --require-tag > "$RUNNER_TEMP/rpm-receipt.json"
          python3 ruwac/tests/integration/rpm_packages.py --rpms "$RUNNER_TEMP/rpms" --evidence "$RUNNER_TEMP/rpm-evidence" --query-only
          RUWAC_GITLEAKS="$RUNNER_TEMP/privacy-tools/gitleaks" python3 ruwac/tests/integration/rpm_reproducible.py --build-root "$GITHUB_WORKSPACE" --rpms "$RUNNER_TEMP/rpms" --evidence "$RUNNER_TEMP/rpm-reproducibility" --require-tag
      - name: Wait for quality and privacy on the exact source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verified-quality.py
      - name: Validate all artifact attestation subjects
        run: |
          python3 ruwac/tests/integration/test_testing_subjects.py
          python3 scripts/testing-subjects.py --bundles "$RUNNER_TEMP/bundles" --rpms "$RUNNER_TEMP/rpms" --output "$RUNNER_TEMP/testing-subjects.sha256"
      - name: Attest the exact tested Fedora archive and RPMs
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/testing-subjects.sha256
          show-summary: false
      - name: Verify provenance identity and retain the signed bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          python3 - <<'PYCODE'
          import os, shutil, subprocess
          from pathlib import Path
          archives = list((Path(os.environ['RUNNER_TEMP'])/'bundles').glob('*.tar.gz'))
          assert len(archives) == 1
          rpms = list((Path(os.environ['RUNNER_TEMP'])/'rpms').glob('*.rpm'))
          assert len(rpms) == 2
          for archive in archives + rpms:
              subprocess.run(['gh','attestation','verify',str(archive),'--repo','w3fans/RUWAC','--signer-workflow','w3fans/RUWAC/.github/workflows/release.yml','--source-ref',os.environ['GITHUB_REF'],'--source-digest',os.environ['GITHUB_SHA'],'--deny-self-hosted-runners','--bundle',os.environ['ATTESTATION_BUNDLE']],check=True)
              shutil.copyfile(os.environ['ATTESTATION_BUNDLE'],archive.with_name(archive.name+'.sigstore.json'))
          PYCODE
      - name: Attach immutable testing assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          directories = [Path(os.environ['RUNNER_TEMP'])/'bundles', Path(os.environ['RUNNER_TEMP'])/'rpms']
          for path in sorted(p for directory in directories for p in directory.iterdir()):
              release = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+tag],text=True))
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              existing = [a for a in release['assets'] if a['name'] == path.name]
              if existing:
                  assert len(existing) == 1 and existing[0]['digest'] == digest, 'Existing immutable asset differs; preserve it'
                  continue
              subprocess.run(['gh','release','upload',tag,str(path)],check=True)
              release = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+tag],text=True))
              assert any(a['name']==path.name and a['digest']==digest and a['state']=='uploaded' for a in release['assets'])
          PYCODE

  portable-cli-build-test:
    if: github.repository == 'w3fans/RUWAC' && startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate portable packaging contracts
        run: python3 ruwac/tests/integration/test_portable_cli.py
      - name: Build one headless CLI with the older glibc baseline
        run: |
          mkdir -p "$RUNNER_TEMP/portable-work" "$RUNNER_TEMP/portable-cargo"
          docker run --rm --cpus=2 --memory=4g --memory-swap=4g --pids-limit=256 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/portable-work,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/portable-cargo,dst=/cargo" \
            --env CARGO_HOME=/cargo \
            registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c \
            /bin/bash -euc 'dnf install -y git rust cargo gcc python3 curl tar xz binutils; python3 /src/scripts/portable-cli.py build --root /src --work /work --zig-archive /work/zig.tar.xz'
      - name: Package the exact tagged binary with dependency notices and privacy checks
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/portable-gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/portable-gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/portable-tools"
          tar -xzf "$RUNNER_TEMP/portable-gitleaks.tar.gz" -C "$RUNNER_TEMP/portable-tools" gitleaks
          RUWAC_GITLEAKS="$RUNNER_TEMP/portable-tools/gitleaks" python3 scripts/portable-cli.py pack \
            --work "$RUNNER_TEMP/portable-work" --output "$RUNNER_TEMP/portable-output" --commit "$GITHUB_SHA"
      - name: Install and test the same packages on Ubuntu and Debian userspaces
        run: |
          python3 ruwac/tests/integration/portable_cli.py --artifacts "$RUNNER_TEMP/portable-output" --evidence "$RUNNER_TEMP/portable-tests"
          python3 scripts/portable-cli.py finish --output "$RUNNER_TEMP/portable-output" --results "$RUNNER_TEMP/portable-tests/results.json"
          python3 scripts/portable-cli.py verify --output "$RUNNER_TEMP/portable-output" --commit "$GITHUB_SHA"
      # Keep qualified bytes across a publisher-only retry; never recompile to
      # repair an attestation/upload failure after the runtime matrix passed.
      - name: Retain qualified portable artifacts for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-cli-${{ github.sha }}
          path: ${{ runner.temp }}/portable-output/
          if-no-files-found: error
          retention-days: 30

  portable-cli-publish:
    if: github.repository == 'w3fans/RUWAC' && startsWith(github.ref, 'refs/tags/')
    needs: portable-cli-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-cli-${{ github.sha }}
          path: ${{ runner.temp }}/portable-output
      - name: Reverify source, all OS receipts and artifact bytes
        run: python3 scripts/portable-cli.py verify --output "$RUNNER_TEMP/portable-output" --commit "$GITHUB_SHA"
      - name: Attest the tested archive, Debian package and OS receipt
        id: portable-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/portable-output/subjects.sha256
          show-summary: false
      - name: Verify provenance and publish immutable portable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ATTESTATION_BUNDLE: ${{ steps.portable-provenance.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, runpy, shutil, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('ruwac/Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          directory = Path(os.environ['RUNNER_TEMP']) / 'portable-output'
          names = runpy.run_path('scripts/portable-cli.py')['names'](version)
          for name in names:
              path = directory / name
              subprocess.run(['gh','attestation','verify',str(path),'--repo','w3fans/RUWAC','--signer-workflow','w3fans/RUWAC/.github/workflows/release.yml','--source-ref',os.environ['GITHUB_REF'],'--source-digest',os.environ['GITHUB_SHA'],'--deny-self-hosted-runners','--bundle',os.environ['ATTESTATION_BUNDLE']],check=True)
              shutil.copyfile(os.environ['ATTESTATION_BUNDLE'],directory/(name+'.sigstore.json'))
          for name in sorted(n + suffix for n in names for suffix in ['', '.sha256', '.sigstore.json']):
              path = directory / name
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              command = ['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+os.environ['GITHUB_REF_NAME']]
              release = json.loads(subprocess.check_output(command,text=True))
              existing = [a for a in release['assets'] if a['name'] == name]
              if existing:
                  assert len(existing) == 1 and existing[0]['digest'] == digest, 'Preserve differing immutable asset'
              else:
                  subprocess.run(['gh','release','upload',os.environ['GITHUB_REF_NAME'],str(path)],check=True)
              published = json.loads(subprocess.check_output(command,text=True))
              assert any(a['name']==name and a['digest']==digest and a['state']=='uploaded' for a in published['assets'])
          PY
